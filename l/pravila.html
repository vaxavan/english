<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правила с Машкой</title>
<style>
/* Мини-уроки грамматики: правило одной картинкой → примеры со звуком → задания от лёгких к трудным,
   при ошибке — короткое объяснение «почему». Значок 💡 открывает правило в любой момент.
   Та же бумага и чернила, что в тренажёрах. Одна светлая тема, как у всех уроков. */
:root{
  --ink:#12241c; --paper:#f2efe6; --chalk:#e8e3d5; --card:#fffdf8;
  --moss:#2f6b46; --leaf:#7fae8c; --clay:#b4573a; --ginger:#e0853f;
  --dim:#6f7d73; --line:rgba(18,36,28,.14);
  --past:#2f6b46; --past-bg:#e3efe6; --to:#b4573a; --to-bg:#f7e4dc;
  --f-display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font:16px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .spacer{flex:1}
.chip{font:13px/1 var(--f-body);border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:var(--dim);cursor:pointer;white-space:nowrap}
.chip.snd{font-size:15px;padding:5px 9px}
.rail{display:flex;gap:4px;padding:10px 0 0}
.rail i{flex:1;height:3px;background:var(--chalk);border-radius:2px;transition:background .3s}
.rail i.done{background:var(--moss)} .rail i.now{background:var(--ink)}
main{max-width:600px;margin:0 auto;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
h1{font:400 clamp(28px,7vw,36px)/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance}
h2{font:400 22px/1.25 var(--f-display);margin:0 0 8px}
.sub{color:var(--dim);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.rule-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rule-row:first-child{border-top:0}
.pron{font:600 22px/1 var(--f-display);padding:8px 12px;border-radius:10px;min-width:74px;text-align:center}
.p-who{background:#e5ecf7;color:#2c4f86}.p-which{background:#f7ead8;color:#94561e}.p-that{background:#ece6f4;color:#5b3f86}
.rule-row small{display:block;color:var(--dim);font-size:13px}
.ex{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;font:inherit;color:var(--ink);cursor:pointer}
.ex .en{font:18px/1.35 var(--f-display)}
.ex .ru{display:block;color:var(--dim);font-size:14px}
.ex .spk{flex:none;font-size:18px;line-height:1.3}
mark{padding:0 3px;border-radius:5px;font-weight:600}
mark.who{background:#e5ecf7;color:#2c4f86} mark.which{background:#f7ead8;color:#94561e} mark.that{background:#ece6f4;color:#5b3f86}
mark.past{background:var(--past-bg);color:var(--past)} mark.to{background:var(--to-bg);color:var(--to)}
.q{font:22px/1.35 var(--f-display);margin:6px 0 16px;text-wrap:balance}
.q .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);text-align:center}
.opts{display:grid;gap:10px}
.opts.row{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{padding:15px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:18px/1.2 var(--f-body);color:var(--ink);cursor:pointer;text-align:center}
.opt.right{background:#e8f2ea;border-color:var(--moss);color:var(--moss);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.wrong{background:#f8e8e2;border-color:var(--clay);color:var(--clay);animation:nudge .3s}
.opt[disabled]{cursor:default}
.clockopt{padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dig-s{display:block;font:600 15px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;margin-top:3px}
.clockopt svg{width:100%;max-width:120px;height:auto}
.tip{background:#fff7e8;border:1px solid #edd9b0;border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:15px}
.tip b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#94561e;margin-bottom:4px}
.next{margin-top:18px;width:100%;padding:16px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font:16px/1 var(--f-body);cursor:pointer}
.next[disabled]{opacity:.35;cursor:default}
.ghost{margin-top:10px;width:100%;padding:12px;border:0;background:none;color:var(--dim);font:15px/1.3 var(--f-body);cursor:pointer}
.bigclock{display:block;width:min(300px,82vw);height:auto;margin:6px auto 10px}
.setter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.setter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font:15px var(--f-body);cursor:pointer;color:var(--ink)}
.digital{font:600 28px/1 ui-monospace,Menlo,monospace;text-align:center;letter-spacing:.04em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lessons button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer}
.lessons .ic{font-size:26px;text-align:center}
.lessons b{font:400 19px/1.25 var(--f-display);display:block}
.lessons small{color:var(--dim)}
.score{font:600 13px var(--f-body);color:var(--moss)}
.mod{margin:0 0 22px}
.mod-h{font:400 22px/1.2 var(--f-display);margin:0 0 10px;display:flex;flex-direction:column}
.mod-h small{font:13px/1.3 var(--f-body);color:var(--dim);margin-top:3px}
.qpic{display:flex;justify-content:center;margin:4px 0 6px}
.qpic svg{width:min(220px,62vw);height:auto}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:0 0 14px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;text-align:center}
.pl svg{width:100%;height:auto;display:block}
.pl b{display:block;font:600 16px/1.2 var(--f-display)}.pl small{color:var(--dim);font-size:12.5px}
.gtab{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
@media (max-width:380px){.gtab td{padding:7px 3px;font-size:14.5px}.gtab tr>:first-child{width:19%}.gtab th{padding:0 3px 8px}.card .gtab{margin:0 -4px;width:calc(100% + 8px)}}
.gtab th{font:600 12px/1.2 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 6px 8px}
.gtab td{padding:7px 6px;border-top:1px solid var(--line);font-family:var(--f-display)}
.gtab td.g0{color:var(--dim);font-family:var(--f-body);font-size:14px}
.tlad .tl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tlad .tl:first-child{border-top:0}.tlad small{display:block;color:var(--dim);font-size:13px}
.freq .fq{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px 0}
.freq .fq b{font:400 18px/1.2 var(--f-display)}
.freq .fq small{grid-column:2;color:var(--dim);font-size:12.5px;margin-top:-2px}
.fbar{height:10px;background:var(--chalk);border-radius:6px;overflow:hidden}.fbar i{display:block;height:100%;background:var(--moss);border-radius:6px}
.soon{opacity:.55}
.w{cursor:pointer;border-bottom:1px dotted rgba(18,36,28,.35)}
.w.kn{border-bottom:2px solid var(--leaf)}
.wpop{position:fixed;z-index:80;min-width:190px;max-width:270px;background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:12px;font:15px/1.35 var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:enter .15s ease-out}
.wp-t b{font:600 17px/1.2 var(--f-display)} .wp-b{opacity:.65;font-size:13px} .wp-ru{margin:2px 0 0}
.wp-btns{display:flex;gap:6px;margin-top:9px}
.wp-btns button{border:0;border-radius:999px;padding:8px 12px;font:14px/1 var(--f-body);cursor:pointer;background:rgba(255,255,255,.14);color:var(--paper)}
.wp-add{flex:1;background:var(--ginger)!important;color:#fff!important;font-weight:600!important}
.wp-add.in{background:rgba(127,174,140,.35)!important}
.dict{display:flex;flex-direction:column;gap:6px}
.d-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.d-row b{font:400 19px/1.2 var(--f-display);display:block}.d-row small{color:var(--dim)}
.d-say,.d-del{border:0;background:none;font-size:18px;cursor:pointer;padding:6px;color:var(--dim)}
.d-ok{color:var(--moss);font-weight:700}
.flash{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-height:200px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:18px;font:inherit;color:var(--ink);cursor:pointer;margin:6px 0 16px}
.f-en{font:400 34px/1.2 var(--f-display)} .f-ru{font-size:20px;color:var(--moss)} .flash small{color:var(--dim)}
.wpop small{display:block;color:var(--leaf);font-size:12px;margin-top:2px}
.opts.row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.big-snd{display:block;margin:6px auto 18px;width:96px;height:96px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:40px;cursor:pointer}
.sounds{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.snd-card{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;font:inherit;color:var(--ink);cursor:pointer}
.snd-card svg{width:120px;height:auto;display:block}
.snd-card small{display:block;color:var(--dim);font-size:13.5px;margin-top:4px}
.ipa{font:600 20px/1 var(--f-display);color:var(--clay)}
.ipa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.ipa-grid div{display:flex;gap:10px;align-items:baseline}
.ipa-grid b{font:600 22px/1 var(--f-display);color:var(--clay);min-width:30px;text-align:center}
.ipa-grid small{display:block;color:var(--dim);font-size:12.5px}
.ipa-q{font-size:28px;color:var(--clay)}
.s-rule{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-col p{margin:0;font:19px/1.6 var(--f-display)}
.s-col.hot{background:#fdf1e6;border-radius:12px;padding:8px 10px}
.s-col.hot b{color:var(--clay);font-size:1.15em}
.ic2{font-size:24px;width:40px;text-align:center}
.where .rule-row{align-items:start}
.cat{display:flex;gap:10px;align-items:center;margin:14px 0}
.cat .mk-pic{width:96px;flex:none}.cat .mk-pic svg{width:100%;height:auto;display:block}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:15px}
.bubble b{display:block;font-size:12px;color:var(--dim)}
.tally{font:400 30px/1.2 var(--f-display);margin:10px 0 4px}
button{transition:transform .12s ease,background-color .2s,border-color .2s}
button:active:not([disabled]){transform:scale(.97)}
button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
main.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.paw{position:fixed;top:-30px;z-index:65;pointer-events:none;animation:paw-fall 1.8s ease-in forwards}
@keyframes paw-fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),75vh) rotate(40deg);opacity:0}}
.mk-lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.42);animation:mk-blink 5.5s infinite}
@keyframes mk-blink{0%,93%,100%{transform:scaleY(.42)}96%{transform:scaleY(1.05)}}
.mk-lid-up{transform:scaleY(.22);animation:mk-blink-up 6s infinite}
@keyframes mk-blink-up{0%,93%,100%{transform:scaleY(.22)}96%{transform:scaleY(1.05)}}
.mk-roll{animation:mk-roll 2.4s ease-in-out infinite}
@keyframes mk-roll{0%,100%{transform:translate(-1.6px,.4px)}50%{transform:translate(1.6px,-.6px)}}
.mk-z{animation:mk-z 2.6s ease-in-out infinite}.mk-z2{animation-delay:.6s}
@keyframes mk-z{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-2px)}}
.mk-bag .mk-tail{transform-origin:0% 100%}
.mk-tail{transform-box:fill-box;transform-origin:0% 50%;animation:mk-tail 3.4s ease-in-out infinite}
@keyframes mk-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.mk-ear-r{transform-box:fill-box;transform-origin:30% 100%;animation:mk-ear 8s infinite}
@keyframes mk-ear{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-9deg)}96%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main id="scene"></main>
<script>/* нет встроенной озвучки (так бывает во встроенном браузере Telegram/WhatsApp на Android):
   урок всё равно работает, только без голоса, и подсказываем открыть в обычном браузере */
(function(){ var no=!window.speechSynthesis||!window.SpeechSynthesisUtterance; if(!no) return;

<script>
const Sound={ac:null,out:null,ensure(){try{if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  this.ac=new AC();const comp=this.ac.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=6;
  this.out=this.ac.createGain();this.out.gain.value=1;this.out.connect(comp);comp.connect(this.ac.destination);}
  if(this.ac.state==="suspended")this.ac.resume();return this.ac;}catch(e){return null;}}};
let mkN = 0;
/* moods: calm, grumpy, roll (eye-roll), happy, sleepy */
function mashkaEyes(id, mood) {
  const G = "#E0853F";
  if (mood === "happy") return `<path d="M28.5 54 q6.5 -6.5 13 0 M58.5 54 q6.5 -6.5 13 0" stroke="#5A3A22" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if (mood === "sleepy") return `<path d="M28.5 52 q6.5 4 13 0 M58.5 52 q6.5 4 13 0" stroke="#5A3A22" stroke-width="2" fill="none" stroke-linecap="round"/><text x="84" y="22" font-size="11" font-family="Comfortaa, sans-serif" fill="#8C9AA8" class="mk-z">z</text><text x="91" y="13" font-size="8" font-family="Comfortaa, sans-serif" fill="#8C9AA8" class="mk-z mk-z2">z</text>`;
  const roll = mood === "roll", grumpy = mood === "grumpy";
  const pupY = roll ? 49.2 : 54, pupR = roll ? "mk-roll" : "";
  const lid = (cx, rot, cls) => `<g transform="rotate(${rot} ${cx} 46)"><rect class="${cls}" x="${cx - 9.5}" y="45.5" width="19" height="14" fill="${G}"/></g>`;
  const lidCls = roll ? "mk-lid mk-lid-up" : "mk-lid";
  const rot = grumpy ? 13 : 0;
  let brows = "";
  if (grumpy) brows = `<path d="M28.5 46.6 L42.5 50.2 M71.5 46.6 L57.5 50.2" stroke="#8C5A33" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  else if (roll) brows = `<path d="M29 43.5 q6 -3 12 0 M59 43.5 q6 -3 12 0" stroke="#8C5A33" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  return `<clipPath id="mkL${id}"><ellipse cx="35" cy="52" rx="6.6" ry="5.8"/></clipPath><clipPath id="mkR${id}"><ellipse cx="65" cy="52" rx="6.6" ry="5.8"/></clipPath>
  <ellipse cx="35" cy="52" rx="6.6" ry="5.8" fill="#C9CF8C"/><ellipse cx="65" cy="52" rx="6.6" ry="5.8" fill="#C9CF8C"/>
  <g class="${pupR}"><ellipse cx="36" cy="${pupY}" rx="2.3" ry="3.4" fill="#2A2A1F"/><ellipse cx="64" cy="${pupY}" rx="2.3" ry="3.4" fill="#2A2A1F"/>
  <circle cx="37.4" cy="${pupY - 1.4}" r="1" fill="#FFF"/><circle cx="65.4" cy="${pupY - 1.4}" r="1" fill="#FFF"/></g>
  <g clip-path="url(#mkL${id})">${lid(35, rot, lidCls)}</g><g clip-path="url(#mkR${id})">${lid(65, -rot, lidCls)}</g>${brows}`;
}
function mashkaHead(id, line, mood) {
  mood = mood || "calm";
  const ol = line ? 'stroke="#B9652B" stroke-width="1.5"' : '';
  const mouth = mood === "happy" ? `<path d="M50 65.3 q-1 4 -5.5 3.6 M50 65.3 q1 4 5.5 3.6" stroke="#A07468" stroke-width="1.3" fill="none" stroke-linecap="round"/>`
    : mood === "grumpy" ? `<path d="M46.4 69 q3.6 -2.6 7.2 0" stroke="#A07468" stroke-width="1.2" fill="none" stroke-linecap="round"/>`
    : `<path d="M50 65.3 q0 3 -3.6 3.3 M50 65.3 q0 3 3.6 3.3" stroke="#A07468" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  return `<g class="mk-ear-l"><path d="M19 47 L9 15 L41 30 Z" fill="#E0853F" ${ol} stroke-linejoin="round"/><path d="M22 41 L15 22 L35 31 Z" fill="#F3C2AA"/><path d="M15 24 l4 3 M17 29 l4 2" stroke="#FBF7F1" stroke-width="1" stroke-linecap="round"/></g>
  <g class="mk-ear-r"><path d="M81 47 L91 15 L59 30 Z" fill="#E0853F" ${ol} stroke-linejoin="round"/><path d="M78 41 L85 22 L65 31 Z" fill="#F3C2AA"/><path d="M85 24 l-4 3 M83 29 l-4 2" stroke="#FBF7F1" stroke-width="1" stroke-linecap="round"/></g>
  <ellipse cx="50" cy="57" rx="38" ry="28.5" fill="#FBF7F1"/>
  <path d="M12.6 62 C11.5 42 26 28.6 46.5 28.4 C46.4 34 46.6 39 47 43 C44 47 42.5 52 41 57 C38 61 31 64 24 66 C18 66.5 14 65 12.6 62 Z" fill="#E0853F"/>
  <path d="M87.6 60 C88.6 41 74 28.6 53.5 28.4 C53.6 34 53.4 39 53 43 C56 47 57.5 51 59 55.5 C62 58.5 69 60.5 76 61.5 C81.5 62 85.5 61.5 87.6 60 Z" fill="#E0853F"/>
  ${line ? '<ellipse cx="50" cy="57" rx="38" ry="28.5" fill="none" stroke="#B9652B" stroke-width="1.5"/>' : ""}

function purr() {
  const ac = Sound.ensure(); if (!ac) return;
  if (!Sound.brown) {
    const len = Math.floor(ac.sampleRate * 2), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    Sound.brown = buf;
  }
  /* a soft, slow purr: breathy low noise pulsing about 20 times a second, out-breath and in-breath */
  const t0 = ac.currentTime + 0.03;
  [[0, 1.35, 1.6, 19], [1.5, 1.0, 0.9, 21.5], [2.65, 1.35, 1.5, 19]].forEach(([st, dur, vol, rate]) => {
    const s0 = t0 + st, src = ac.createBufferSource(); src.buffer = Sound.brown; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 170; bp.Q.value = 0.8;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520;
    const am = ac.createGain(); am.gain.value = 0.5; const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = rate;
    const lg = ac.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
    const env = ac.createGain(); env.gain.setValueAtTime(0.0001, s0); env.gain.linearRampToValueAtTime(vol, s0 + 0.3); env.gain.setValueAtTime(vol, s0 + dur - 0.35); env.gain.linearRampToValueAtTime(0.0001, s0 + dur);
    src.connect(bp); bp.connect(lp); lp.connect(am); am.connect(env); env.connect(Sound.out);
    src.start(s0); lfo.start(s0); src.stop(s0 + dur + 0.05); lfo.stop(s0 + dur + 0.05);
  });
}

/* ═══ ЗВУКИ И ОТКЛИК ИНТЕРФЕЙСА ═══
   Одна мягкая «деревянно-стеклянная» палитра: всё тихое, короткое, без резких частот.
   Ошибка — глухой мягкий звук, не «бззз»: ошибка не наказание.
   Выключается кнопкой 🔊 в шапке, выбор общий для всего сайта (eng-sound). */
const UI={
  on(){ try{ return localStorage.getItem('eng-sound')!=='off'; }catch(e){ return true; } },
  set(v){ try{ localStorage.setItem('eng-sound',v?'on':'off'); }catch(e){} },
  tone(f,t,dur,vol,type){ const ac=Sound.ensure(); if(!ac||!this.on()) return;
    const o=ac.createOscillator(), g=ac.createGain(), s=ac.currentTime+(t||0);
    o.type=type||'sine'; o.frequency.setValueAtTime(f,s);
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol||.12,s+0.008); g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
    o.connect(g); g.connect(Sound.out); o.start(s); o.stop(s+dur+0.02); },
  vib(p){ try{ this.on()&&navigator.vibrate&&navigator.vibrate(p); }catch(e){} },
  tap(){ this.tone(520,0,.06,.05,'triangle'); },
  tick(){ this.tone(880,0,.05,.045,'triangle'); },
  right(){ this.tone(784,0,.16,.1); this.tone(1175,.08,.22,.09); this.vib(12); },
  wrong(){ this.tone(220,0,.18,.09,'sine'); this.tone(196,.07,.2,.07,'sine'); this.vib([25,40,25]); },
  stage(){ [523,659,784].forEach((f,i)=>this.tone(f,i*.09,.22,.08)); },
  finish(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,i*.1,.3,.08)); this.tone(1319,.42,.5,.06); },
  sparkle(){ [1568,2093,2637].forEach((f,i)=>this.tone(f,i*.06,.18,.04)); }
};

}

<script>
/* ═══ ЧАСЫ ═══ */
const NUM=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const MIN_EN={5:'five',10:'ten',15:'a quarter',20:'twenty',25:'twenty-five',30:'half'};
const H_GEN=['двенадцатого','первого','второго','третьего','четвёртого','пятого','шестого','седьмого','восьмого','девятого','десятого','одиннадцатого','двенадцатого'];
const H_NOM=['двенадцать','час','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать'];
const MIN_RU_PAST={5:'пять минут',10:'десять минут',15:'четверть',20:'двадцать минут',25:'двадцать пять минут',30:'половина'};
const MIN_RU_TO={5:'без пяти',10:'без десяти',15:'без четверти',20:'без двадцати',25:'без двадцати пяти'};
const h12=h=>((h-1)%12+12)%12+1;
function timeEn(h,m){ h=h12(h);
  if(m===0) return `It's ${NUM[h]} o'clock`;
  if(m<=30) return `It's ${MIN_EN[m]} past ${NUM[h]}`;
  return `It's ${MIN_EN[60-m]} to ${NUM[h12(h+1)]}`; }
function timeHtml(h,m){ h=h12(h);
  if(m===0) return `It's ${NUM[h]} <mark class="past">o'clock</mark>`;
  if(m<=30) return `It's ${MIN_EN[m]} <mark class="past">past</mark> ${NUM[h]}`;
  return `It's ${MIN_EN[60-m]} <mark class="to">to</mark> ${NUM[h12(h+1)]}`; }
function timeRu(h,m){ h=h12(h);
  if(m===0) return `Ровно ${H_NOM[h]}`;
  if(m<=30) return `${MIN_RU_PAST[m]} ${H_GEN[h12(h+1)]}`.replace(/^./,c=>c.toUpperCase());
  return `${MIN_RU_TO[60-m]} ${H_NOM[h12(h+1)]}`.replace(/^./,c=>c.toUpperCase()); }
const digital=(h,m)=>`${h12(h)}:${String(m).padStart(2,'0')}`;

/* циферблат: halves=true — правая половина «past» зелёная, левая «to» рыжая */
function clockSVG(h,m,o={}){
  const cx=100,cy=100,R=88, a=(deg)=>(deg-90)*Math.PI/180;
  let s=`<svg viewBox="${o.minuteLabels?'-22 -30 244 252':'0 0 200 200'}" class="${o.cls||''}" role="img" aria-label="${o.label||digital(h,m)}">`;
  if(o.halves){
    s+=`<path d="M100 100 L100 12 A88 88 0 0 1 100 188 Z" fill="var(--past-bg)"/>
        <path d="M100 100 L100 188 A88 88 0 0 1 100 12 Z" fill="var(--to-bg)"/>
        ${o.minuteLabels?`<text x="150" y="-14" text-anchor="middle" font-size="15" font-weight="700" fill="var(--past)" font-family="system-ui">past →</text>
        <text x="50" y="-14" text-anchor="middle" font-size="15" font-weight="700" fill="var(--to)" font-family="system-ui">← to</text>`:''}`;
  } else s+=`<circle cx="100" cy="100" r="${R}" fill="#fff"/>`;
  s+=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--ink)" stroke-width="3"/>`;
  for(let i=0;i<60;i++){ const big=i%5===0, r1=big?R-10:R-5, an=a(i*6);
    s+=`<line x1="${cx+r1*Math.cos(an)}" y1="${cy+r1*Math.sin(an)}" x2="${cx+(R-1)*Math.cos(an)}" y2="${cy+(R-1)*Math.sin(an)}" stroke="var(--ink)" stroke-width="${big?2.2:.8}" stroke-opacity="${big?1:.5}"/>`; }
  for(let i=1;i<=12;i++){ const an=a(i*30), r=R-22;
    s+=`<text x="${cx+r*Math.cos(an)}" y="${cy+r*Math.sin(an)+5.5}" text-anchor="middle" font-size="${o.small?18:15}" font-family="Georgia,serif" fill="var(--ink)">${i}</text>`; }
  if(o.minuteLabels) [[5,'5'],[10,'10'],[15,'¼'],[20,'20'],[25,'25'],[30,'½'],[35,'25'],[40,'20'],[45,'¼'],[50,'10'],[55,'5']].forEach(([mm,t])=>{
    const an=a(mm*6), r=R+0; s+=`<text x="${cx+(R+13)*Math.cos(an)}" y="${cy+(R+13)*Math.sin(an)+4}" text-anchor="middle" font-size="12" font-weight="700" font-family="system-ui" fill="${mm<=30?'var(--past)':'var(--to)'}">${t}</text>`; });
  const ha=a((h12(h)%12)*30+m*0.5), ma=a(m*6);
  s+=`<line x1="100" y1="100" x2="${100+46*Math.cos(ha)}" y2="${100+46*Math.sin(ha)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <line class="mhand" x1="100" y1="100" x2="${100+70*Math.cos(ma)}" y2="${100+70*Math.sin(ma)}" stroke="var(--clay)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="5" fill="var(--ink)"/></svg>`;
  return s;
}

/* формы заданий для времени */
function wrongTimes(h,m){ const S=new Set([`${h}:${m}`]), out=[];
  const cand=[[h,(m+30)%60],[h12(h+1),m],[h,(60-m)%60],[h12(h-1),m],[h,(m+15)%60],[h12(h+1),(60-m)%60]];
  for(const [a,b] of cand){ const k=`${a}:${b}`; if(!S.has(k)){S.add(k); out.push([a,b]);} if(out.length===2)break; } return out; }
function readTask(h,m){ const opts=[[h,m],...wrongTimes(h,m)].sort(()=>Math.random()-.5);
  return {type:'read',h,m,opts,tip:m===0?'Длинная стрелка на 12 — значит ровно: <b>o\'clock</b>.'
    : m<=30?`Длинная стрелка <b>справа</b> → <b>past</b>, час — тот, что уже прошёл: ${NUM[h]}.`
    : `Длинная стрелка <b>слева</b> → <b>to</b>, и час — <b>следующий</b>: ${NUM[h12(h+1)]}.`}; }
function pickClockTask(h,m){ const opts=[[h,m],...wrongTimes(h,m)].sort(()=>Math.random()-.5);
  return {type:'clock',h,m,opts,tip:m<=30?'<b>past</b> — длинная стрелка в правой половине.':'<b>to</b> — длинная стрелка в левой половине, а короткая почти дошла до следующего часа.'}; }
function setTask(h,m){ return {type:'set',h,m,tip:m<=30?'past — крути длинную стрелку вправо от 12.':'to — длинная стрелка в левой половине: 12 минус столько минут.'}; }

/* ═══ ПРАВИЛА ИЗ ГРАММАТИЧЕСКОГО СПРАВОЧНИКА SPOTLIGHT 6 (модули 1–4) ═══
   Тот же формат: правило картинкой → где встречается → примеры → задания с «почему».
   Последний аргумент G — перевод всего предложения: показываем после правильного ответа. */
const grid=(rows,heads)=>`<div class="card"><table class="gtab">${heads?`<tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?'':' class="g0"'}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* картинки «где Машка?»: коробка или стол и кошка */
function placeSVG(k){
  const box=(x,y,h=34)=>`<rect x="${x}" y="${y}" width="40" height="${h}" rx="3" fill="#d9a066" stroke="#8a5a2b" stroke-width="2"/><path d="M${x+20} ${y}v8" stroke="#8a5a2b" stroke-width="1.2" opacity=".55"/>`;
  const table=`<rect x="22" y="38" width="56" height="6" rx="2" fill="#a8743f"/><rect x="27" y="44" width="5" height="28" fill="#a8743f"/><rect x="68" y="44" width="5" height="28" fill="#a8743f"/>`;
  const cat=(x,y,s=24)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle">🐱</text>`;
  const ground='<path d="M4 72h92" stroke="#12241c" stroke-opacity=".25" stroke-width="2"/>';
  const pic={
    /* открытая коробка: тёмное нутро, створки в стороны, кошка внутри */
    in:      `<path d="M30 40 L20 30 M70 40 L80 30" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/><path d="M20 30 L30 40 L30 36 Z M80 30 L70 40 L70 36 Z" fill="#d9a066"/>
              <rect x="30" y="38" width="40" height="10" fill="#6b4320"/>${cat(50,52,22)}<rect x="30" y="46" width="40" height="26" rx="3" fill="#d9a066" stroke="#8a5a2b" stroke-width="2"/>`,
    on:      `${table}${cat(50,36)}`,
    under:   `${table}${cat(50,70,20)}`,
    'next to':`${box(18,38)}${cat(76,70)}`,
    /* за коробкой: из-за правого края видна половина кошки, коробка закрыта */
    behind:  `${cat(66,46,22)}${box(26,38)}`,
    /* перед коробкой: коробка стоит на полу, кошка крупнее и ниже, заслоняет её */
    'in front of':`${box(30,38)}${cat(50,82,28)}`,
    between: `${box(4,38)}${box(56,38)}${cat(50,70,20)}`
  }[k];
  return `<svg viewBox="0 0 100 86" class="place" role="img" aria-label="${k}">${ground}${pic}</svg>`;
}

/* whose — четвёртое «который» из справочника модуля 3 */
(function(){
  const R=LESSONS.relative, oldRule=R.rule, oldTasks=R.tasks;
  R.title='Who, which, that, whose'; R.sub='«который» и «чей» — загадки, определения, склейка';
  R.rule=()=>oldRule().replace('</div>\n  </div>\n  <p class="sub">Запомнить просто',
    '</div>\n    <div class="rule-row"><span class="pron p-who" style="background:#e3efe6;color:#2f6b46">whose</span><div><b>чей, у которого</b><small>the girl <i>whose</i> father is a driver — девочка, у которой папа водитель</small></div></div>\n  </div>\n  <p class="sub">Запомнить просто');
  R.examples=[...R.examples, ex('Niko is the guinea pig <mark class="who">whose</mark> stripes are orange.','👉 Нико — та морская свинка, у которой рыжие полоски.')];
  R.tasks=()=>{ const T=oldTasks(), W=shf([
      {type:'pick',q:"That's the girl ___ father is a racing driver.",ok:['whose'],opts:['who','which','whose'],tip:'«у которой папа», «чей папа» → <b>whose</b>.',ru:'Это девочка, у которой папа — гонщик.'},
      {type:'pick',q:'This is the boy ___ bike is red.',ok:['whose'],opts:['who','which','whose'],tip:'«чей велосипед» → <b>whose</b>.',ru:'Это мальчик, у которого красный велосипед.'},
      {type:'pick',q:'I have a friend ___ cat is called Mashka.',ok:['whose'],opts:['who','which','whose'],tip:'«у которой кошку зовут…» → <b>whose</b>.',ru:'У меня есть подруга, у которой кошку зовут Машка.'},
      {type:'pick',q:'Niko is the guinea pig ___ stripes are orange.',ok:['whose'],opts:['which','that','whose'],tip:'«у которой полоски» → <b>whose</b>.',ru:'Нико — морская свинка, у которой рыжие полоски.'}]).slice(0,2);
    T.splice(5,0,...W); return T; };
})();

let enV=null; const pickV=()=>{const v=speechSynthesis.getVoices(); enV=v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'))||null;};

const LKEYS=['sp6-1a','sp6-1c','sp6-2c','sp6-3a'];
function knownSet(){ const S=new Set(); LKEYS.forEach(k=>{ try{ const d=JSON.parse(localStorage.getItem(k)||'{}'); Object.keys(d).forEach(w=>{ if(d[w]&&d[w].learned) S.add(w.toLowerCase()); }); }catch(e){} }); return S; }
function lemma(w){ w=w.toLowerCase().replace(/’/g,"'"); const c=[w];
  if(/n't$/.test(w)) c.push(w.replace(/n't$/,''), w==="won't"?'will':w==="can't"?'can':'');
  if(w.endsWith("'s")) c.push(w.slice(0,-2)); if(w.endsWith("'ll")) c.push('will');
  if(w.endsWith('ies')) c.push(w.slice(0,-3)+'y'); if(w.endsWith('es')) c.push(w.slice(0,-2)); if(w.endsWith('s')) c.push(w.slice(0,-1));
  if(w.endsWith('ing')) c.push(w.slice(0,-3), w.slice(0,-3)+'e', w.slice(0,-4));
  return c.find(x=>x&&GL[x]); }
function wrapWords(root){
  const K=knownSet();
  root.querySelectorAll('.q, .ex .en, .card, .sub, .tip, .bubble, .snd-card span').forEach(el=>{
    if(el.dataset.wrapped) return; el.dataset.wrapped=1;
    const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.gap,.w,.opt,.pron,svg,.ipa,.ipa-grid b,.eyebrow,[data-wrapped="1"] [data-wrapped]')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
    nodes.forEach(n=>{ const t=n.nodeValue; if(!/[A-Za-z]/.test(t)) return;
      const f=document.createDocumentFragment(); let last=0;
      t.replace(/[A-Za-zé]+(?:['’][a-z]+)?/g,(m,i)=>{ if((m.length<2&&m!=='I'&&m!=='a')||/^(ch|dra|ing|jes|na|pedl|ri|sh|si|th|ll|ve|ng|es|ies|tʃ|ss|fe|ves|oo|ee|fi|nin|twel|twent|ie|st|nd|rd|dr|selves|ed)$/i.test(m)||/\/[^\/]*$/.test(t.slice(0,i))&&/^[^\/]*\//.test(t.slice(i))) return m; const L=lemma(m)||('?'+m.toLowerCase());
        f.appendChild(document.createTextNode(t.slice(last,i)));
        const sp=document.createElement('span'); sp.className='w'+(K.has(L)||K.has(m.toLowerCase())?' kn':''); sp.dataset.l=L; sp.textContent=m; f.appendChild(sp); last=i+m.length; return m; });
      f.appendChild(document.createTextNode(t.slice(last))); n.replaceWith(f); });
  });
}

  has(en){return this.get().some(x=>x.en.toLowerCase()===en.toLowerCase())},
  add(en,ru){const a=this.get(); if(!this.has(en)) a.unshift({en,ru,at:Date.now(),ok:0}); this.save(a);},

  e.preventDefault(); e.stopPropagation();
  let word=w.textContent, L=w.dataset.l, base=L[0]==='?'?L.slice(1):L, ru=GL[L]?GL[L][0]:'';
  const nx=w.nextSibling&&w.nextSibling.nodeValue===' '?w.nextSibling.nextSibling:null;
  const pv=w.previousSibling&&w.previousSibling.nodeValue===' '?w.previousSibling.previousSibling:null;
  if(nx&&nx.classList&&nx.classList.contains('w')&&GLM[L+' '+nx.dataset.l]){ word=word+' '+nx.textContent; base=L+' '+nx.dataset.l; ru=GLM[base][0]; }
  else if(pv&&pv.classList&&pv.classList.contains('w')&&GLM[pv.dataset.l+' '+L]){ word=pv.textContent+' '+word; base=pv.dataset.l+' '+L; ru=GLM[base][0]; }

  const showBase=base.toLowerCase()!==word.toLowerCase()&&!/^(i|a|an)$/.test(base);
  wpop=document.createElement('div'); wpop.className='wpop';
  const draw=()=>{ const inD=DICT.has(base);
    wpop.innerHTML=`<div class="wp-t"><b>${word}</b>${showBase?` <span class="wp-b">(${base})</span>`:''}</div>

      <div class="opts row">${t.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div><div id="guess"></div>`;
  } else if(t.type==='join'){
    body=`<p class="eyebrow">${t.label||'🔗 Склей в одно предложение'}</p><p class="q">${t.q}</p>
      <div class="opts">${t.opts.map(o=>`<button class="opt" data-v="${o}" style="text-align:left;font-size:16px">${o}</button>`).join('')}</div>`;
  } else if(t.type==='listen'){
    body=`<p class="eyebrow">👂 Послушай и выбери слово</p><button class="big-snd" id="again">🔊</button>
      <div class="opts row">${t.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
  } else if(t.type==='read'){
    body=`<p class="q" style="text-align:center;font-size:18px">Который час?</p>${clockSVG(t.h,t.m,{cls:'bigclock'})}<div class="digital">${digital(t.h,t.m)}</div>
      <div class="opts">${t.opts.map(([h,m])=>`<button class="opt" data-v="${h}:${m}">${timeEn(h,m)}</button>`).join('')}</div>`;
  } else if(t.type==='clock'){
    body=`<p class="q" style="text-align:center">${timeEn(t.h,t.m)}<br><small style="font:14px var(--f-body);color:var(--dim)">Выбери часы</small></p>
      <div class="opts row">${t.opts.map(([h,m])=>`<button class="opt clockopt" data-v="${h}:${m}">${clockSVG(h,m,{small:true})}<b class="dig-s">${digital(h,m)}</b></button>`).join('')}</div>`;
  } else if(t.type==='set'){
    t.cur=[t.h,0];
    body=`<p class="q" style="text-align:center">Поставь стрелки: <b>${timeEn(t.h,t.m).replace("It's ","")}</b></p>
      <div id="clk">${clockSVG(t.h,0,{cls:'bigclock'})}<div class="digital">${digital(t.h,0)}</div></div>
      <div class="setter"><button data-d="-60">− час</button><button data-d="-5">− 5 мин</button><button data-d="5">+ 5 мин</button><button data-d="60">+ час</button></div>
      <button class="next" id="check">Проверить</button>`;
  }
  scene.innerHTML=`${rail()}<p class="eyebrow" style="margin-top:12px">Задание ${ti+1} из ${tasks.length}</p>${body}<div id="fb"></div>`;
  if(t.type==='listen'){ setTimeout(()=>say(t.word),350); document.getElementById('again').onclick=()=>say(t.word); }
  if(t.type==='set'){
    const clk=document.getElementById('clk');
    const draw=()=>{ clk.innerHTML=clockSVG(t.cur[0],t.cur[1],{cls:'bigclock'})+`<div class="digital">${digital(t.cur[0],t.cur[1])}</div>`; };
    scene.querySelectorAll('.setter button').forEach(b=>b.onclick=()=>{ let tot=(t.cur[0]%12)*60+t.cur[1]+ +b.dataset.d; tot=(tot+720)%720;
      t.cur=[Math.floor(tot/60)||12, tot%60]; UI.tick(); draw(); });
    document.getElementById('check').onclick=()=>{
      // «to» — правильный час на циферблате тот же, что в цифрах (4:50 — короткая стрелка почти у 5)
      const ok=h12(t.cur[0])===h12(t.h)&&t.cur[1]===t.m;
      answer(ok, ok?null:`Сейчас на часах ${digital(t.cur[0],t.cur[1])} — это <i>${timeEn(t.cur[0],t.cur[1]).replace("It's ","")}</i>. ${t.tip}`, `${timeEn(t.h,t.m)} = ${digital(t.h,t.m)}`);
    };
  } else {
    scene.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(b.closest('#guess')) return;
      const ok= (t.type==='pick'||t.type==='riddle'||t.type==='listen') ? t.ok.includes(v) : t.type==='join' ? v===t.ok : v===`${t.h}:${t.m}`;
      if(ok&&t.type==='riddle'){ b.classList.add('right'); scene.querySelectorAll('.opts .opt').forEach(x=>x.disabled=true);
        document.getElementById('gap').textContent=v; UI.tick();
        const g=document.getElementById('guess');
        g.innerHTML=`<p class="sub" style="margin:16px 0 8px">Верно! А теперь — что это?</p><div class="opts">${t.aopts.map(o=>[Math.random(),o]).sort((p,q)=>p[0]-q[0]).map(x=>`<button class="opt" data-a="${x[1]}">${x[1]}</button>`).join('')}</div>`;
        g.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{
          if(x.dataset.a===t.ans){ x.classList.add('right'); g.querySelectorAll('.opt').forEach(y=>y.disabled=true);
            say(t.q.replace('___',v)+' '+t.ans); answer(true,null,`${t.q.replace('___','<b>'+v+'</b>')} — <b>${t.ans}</b>`); }
          else { x.classList.add('wrong'); x.disabled=true; UI.wrong(); firstTry=false; } });
        return; }
      if(ok){ b.classList.add('right'); scene.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        if(t.type==='pick'){ const g=document.getElementById('gap'); if(g){ g.textContent=v; say(t.q.replace('___',v)); } else if(t.sayOk) say(t.sayOk); } else if(t.type==='join'||t.type==='listen') say(v); else say(timeEn(t.h,t.m));
        const extra= t.ru ? t.ru : t.type==='listen' ? `Это <b>${v}</b>.` : t.type==='pick'&&t.ok.length>1&&t.ok.includes('that') ? (v==='that'?`Можно и <b>${t.ok[0]}</b>.`:'<b>that</b> тоже подошло бы.') : (t.type==='pick'?'':t.type==='join'?'Одно предложение вместо двух — так и говорят.':t.type!=='pick'?`${digital(t.h,t.m)} — ${timeRu(t.h,t.m)}.`:'');
        answer(true,null,extra);
      } else { b.classList.add('wrong'); b.disabled=true; answer(false,t.tip); }
    });
  }
  enter();
}
function answer(ok,tip,extra){
  const fb=document.getElementById('fb');
  if(ok){ UI.right(); if(firstTry) score++;
    fb.innerHTML=`${extra?`<p class="sub" style="margin:14px 0 0">✓ ${extra}</p>`:''}<button class="next" id="nx">Дальше</button>`;
    document.getElementById('nx').onclick=()=>{ ti++; task(); };
    const ch=document.getElementById('check'); if(ch) ch.remove();
  } else { UI.wrong(); firstTry=false;
    fb.innerHTML=`<div class="tip"><b>💡 Почему</b>${tip}</div>`; }
}
function result(){
  const of=tasks.length, prev=RS.get()[LID]||{};
  RS.set(LID,{best:Math.max(prev.best||0,score),of,at:Date.now()});
  const all=score===of; UI.finish(); if(all) setTimeout(paws,200);
  scene.innerHTML=`<p class="eyebrow">Итог</p><p class="tally">${all?'Всё с первого раза!':`С первого раза: ${score} из ${of}`}</p>
    ${mascot(all?'happy':'calm', all?'Чисто. Правило у тебя в лапах. Мур.' : score>=of*0.6?'Ошибки были, но ты разобралась, почему. Так правило и запоминается.' : 'Это правило с подвохом. Посмотри ещё раз картинку 💡 и попробуй снова — во второй раз всегда легче.')}
    <button class="next" id="again">Ещё раз — задания перемешаются</button>
    <button class="ghost" id="rule">💡 Посмотреть правило</button>
    <button class="ghost" id="back">← Все правила</button>`;
  document.getElementById('again').onclick=()=>{ tasks=L.tasks(); ti=0; score=0; task(); };
  document.getElementById('rule').onclick=ruleScreen;
  document.getElementById('back').onclick=list; enter();
}
bulb.onclick=()=>{ if(!L) return;
  const bg=document.createElement('div'); bg.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(18,36,28,.4);display:flex;align-items:flex-end;justify-content:center';
  bg.innerHTML=`<div style="background:var(--paper);width:min(600px,100%);max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))">
    <p class="eyebrow">💡 Правило</p><h2>${L.title}</h2>${L.rule()}<button class="next" id="cl">Понятно</button></div>`;
  document.body.appendChild(bg); wrapWords(bg); bg.querySelector('#cl').onclick=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
};

/* ═══ МОЙ СЛОВАРИК ═══ */
function dictScreen(){
  L=null; bulb.hidden=true; homeBtn.style.visibility='visible';
  const a=DICT.get();
  scene.innerHTML=`<p class="eyebrow">Мой словарик</p><h1>${a.length?`Слов: ${a.length}`:'Пока пусто'}</h1>
    <p class="sub">${a.length?'Слова, которые ты сохранила. Нажми 🔊 — послушать, ✕ — убрать.':'Нажми на любое английское слово в правилах, а потом — «＋ в словарик». Оно появится здесь.'}</p>
    ${a.length?`<button class="next" id="drill" style="margin:0 0 16px">Проверь себя</button>`:''}
    <div class="dict">${a.map((x,i)=>`<div class="d-row"><button class="d-say" data-i="${i}">🔊</button><span><b>${x.en}</b><small>${x.ru||'—'}</small></span>${x.ok>=2?'<span class="d-ok">✓</span>':''}<button class="d-del" data-i="${i}" aria-label="Убрать">✕</button></div>`).join('')}</div>`;
  scene.querySelectorAll('.d-say').forEach(b=>b.onclick=()=>say(a[+b.dataset.i].en));
  scene.querySelectorAll('.d-del').forEach(b=>b.onclick=()=>{ DICT.del(a[+b.dataset.i].en); dictScreen(); });
  const d=document.getElementById('drill'); if(d) d.onclick=()=>drill();
  enter();
}
function drill(){
  const a=DICT.get().slice().sort((x,y)=>(x.ok||0)-(y.ok||0)||Math.random()-.5).slice(0,10); let i=0,known=0;
  const card=()=>{ if(i>=a.length){ UI.finish(); scene.innerHTML=`<p class="eyebrow">Словарик</p><p class="tally">Знаю: ${known} из ${a.length}</p>
      ${mascot(known===a.length?'happy':'calm',known===a.length?'Все слова твои. Мур.':'Те, что «ещё учу», покажу первыми в следующий раз.')}
      <button class="next" id="again">Ещё раз</button><button class="ghost" id="back">← Словарик</button>`;
      document.getElementById('again').onclick=drill; document.getElementById('back').onclick=dictScreen; enter(); return; }
    const x=a[i];
    scene.innerHTML=`${'<div class="rail">'+a.map((_,k)=>`<i class="${k<i?'done':k===i?'now':''}"></i>`).join('')+'</div>'}
      <p class="eyebrow" style="margin-top:12px">Вспомни перевод</p>
      <button class="flash" id="fl"><span class="f-en">${x.en}</span><span class="f-ru" hidden>${x.ru||'—'}</span><small>нажми — покажу перевод</small></button>
      <div class="opts row two" id="fbtn" hidden><button class="opt" id="no">Ещё учу</button><button class="opt" id="yes">Знаю ✓</button></div>`;
    say(x.en);
    document.getElementById('fl').onclick=()=>{ scene.querySelector('.f-ru').hidden=false; scene.querySelector('.flash small').hidden=true; document.getElementById('fbtn').hidden=false; };
    const fin=ok=>{ const all=DICT.get(); const y=all.find(z=>z.en===x.en); if(y){ y.ok=ok?(y.ok||0)+1:0; DICT.save(all);} if(ok){known++;UI.right();} else UI.tick(); i++; card(); };
    document.getElementById('yes').onclick=()=>fin(true); document.getElementById('no').onclick=()=>fin(false);
    enter();
  };
  card();
}
document.getElementById('dictChip').onclick=dictScreen;
paintDict();
homeBtn.onclick=list;
soundButton(document.getElementById('sndHost'));
(function start(){ const id=(location.hash||'').slice(1); if(id==='dict') dictScreen(); else if(LESSONS[id]) open(id); else list(); })();

</script>
