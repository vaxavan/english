<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12241c">
<title>The United Kingdom — тренажёр текста</title>
<style>
:root{--ink:#12241c;--paper:#f2efe6;--chalk:#e8e3d5;--moss:#2f6b46;--clay:#b4573a;
  --dim:#7b8a80;--line:rgba(18,36,28,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.brand{font:13px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.spacer{flex:1}
.chip{font:13px/1 system-ui,sans-serif;border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;background:#fff;color:var(--dim)}
.rail{display:flex;gap:4px;padding:12px 18px 0}
.rail i{flex:1;height:3px;background:var(--chalk);border-radius:2px}
.rail i.done{background:var(--moss)} .rail i.now{background:var(--ink)}
.phase{font:12px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);padding:11px 18px 0}
main{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:12px 18px 28px;max-width:660px;width:100%;margin:0 auto}
.eyebrow{font:12px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px}
h1{font-size:clamp(27px,7.2vw,38px);font-weight:400;margin:0 0 10px;line-height:1.15}
/* картинка ограничена по ВЫСОТЕ экрана, а не по ширине —
   иначе на маленьком телефоне выдавливает кнопки за край */
.pic{display:block;margin:0 auto 12px;border-radius:10px;
  max-height:24vh;width:auto;max-width:100%;object-fit:contain}
.pic.scheme{max-height:22vh}
@media (min-height:760px){ .pic{max-height:28vh} .pic.scheme{max-height:26vh} }
@media (max-height:640px){ .pic{max-height:19vh} .pic.scheme{max-height:18vh} }
.pic.wide{max-width:260px;width:80%}
.piece{font-size:clamp(26px,6.8vw,38px);line-height:1.35;margin:0 0 12px}
.piece .old{color:var(--dim)} .piece .new{color:var(--ink)}
.en{font-size:clamp(21px,5.2vw,28px);line-height:1.4;margin:0 0 10px}
.ru{font:16px/1.45 system-ui,sans-serif;margin:0 0 4px}
.tr{font:14px/1.4 system-ui,sans-serif;color:var(--moss);margin:0 0 18px}
.big-tr{font:17px/1.4 system-ui,sans-serif;color:var(--moss);margin:0 0 8px}
.sub{color:var(--dim);font:15px/1.45 system-ui,sans-serif;margin:0 0 16px}
.big{width:100%;padding:17px;border-radius:14px;background:var(--ink);color:var(--paper);
  font:17px/1 system-ui,sans-serif;margin:0 0 10px}
.big.go{background:var(--moss)}
.big.on{background:var(--moss)}
.ghostbtn{margin-top:6px;width:100%;padding:12px;color:var(--dim);font:14px/1.35 system-ui,sans-serif}
.row{display:flex;gap:8px;margin:0 0 12px}
.spd{flex:1;border:1px solid var(--line);border-radius:999px;padding:9px 0;background:#fff;
  font:13px/1 system-ui,sans-serif;color:var(--dim)}
.spd.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.line{min-height:62px;border-bottom:2px solid var(--ink);padding:4px 2px 12px;margin-bottom:16px;
  font-size:clamp(19px,4.6vw,25px);line-height:1.5}
.ghost{color:var(--chalk)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chipw{padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:10px;
  font-size:18px;font-family:Georgia,serif}
.chipw.used{opacity:.25;pointer-events:none}
.chipw.shake{animation:nudge .3s;border-color:var(--clay);color:var(--clay)}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cat{display:flex;gap:12px;align-items:flex-start;margin:18px 0 0;cursor:pointer}
.cat svg{flex:none}
.bubble{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;font:15px/1.4 system-ui,sans-serif;flex:1;margin-top:8px}
.bubble::before{content:'';position:absolute;left:-7px;top:16px;width:12px;height:12px;background:#fff;
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.blocks{list-style:none;padding:0;margin:18px 0 0;border-top:1px solid var(--line)}
.blocks li{display:flex;justify-content:space-between;gap:12px;padding:14px 10px;margin:0 -10px;
  border-bottom:1px solid var(--line);cursor:pointer}
.blocks li.ok{color:var(--moss)} .blocks li b{font-weight:400}
.blocks li span{font:13px/1 system-ui,sans-serif;color:var(--dim)}
.trap{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:0 0 10px;cursor:pointer}
.trap b{font-weight:400;font-size:22px}
.trap span{display:block;font:13px/1.4 system-ui,sans-serif;color:var(--clay);margin-top:3px}
.why{font:13px/1.5 system-ui,sans-serif;color:var(--dim);border-left:3px solid var(--line);
  padding-left:12px;margin:16px 0 0}
</style>
</head>
<body>
<header><button class="chip" id="home" title="К списку">← Список</button>
  <span class="spacer"></span>
  <button class="chip" id="catBtn">🐱</button></header>
<div class="rail" id="rail"></div>
<div class="phase" id="phase"></div>
<main id="scene"></main>

  mark(i){const d=this.all(); if(!d.done.includes(i)){d.done.push(i);this.save(d);}},
  catOn(){return this.all().cat!==false},
  toggleCat(){const d=this.all(); d.cat=!this.catOn(); this.save(d);}
};

let enV=null,ruV=null,rate=.75,looping=false;
const pickV=()=>{const v=speechSynthesis.getVoices();
  enV=v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'))||null;
  ruV=v.find(x=>x.lang.startsWith('ru'))||null;};
pickV(); speechSynthesis.addEventListener('voiceschanged',pickV);
function stop(){looping=false; speechSynthesis.cancel();}
function say(t){speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=rate;
  if(enV)u.voice=enV; speechSynthesis.speak(u);}
function loop(t,gap){
  if(!looping)return;
  const u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=rate;
  if(enV)u.voice=enV;
  u.onend=()=>{if(looping)setTimeout(()=>loop(t,gap),gap);};
  speechSynthesis.speak(u);
}
function catSay(t){if(!Store.catOn()||!ruV)return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='ru-RU'; u.pitch=1.35; u.voice=ruV;
  speechSynthesis.speak(u);}
function catArt(){
  const s='fill="none" stroke="#12241c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  return `<svg viewBox="0 0 94 100" width="64" height="68" ${s}>
   <path d="M27 24L24 9l14 7M67 24l3-15-14 7"/><circle cx="47" cy="40" r="23"/>
   <path d="M34 40c2.5-3.5 7-3.5 9.5 0M50.5 40c2.5-3.5 7-3.5 9.5 0"/>
   <path d="M47 48.5l-2.5 2h5z" fill="#12241c" stroke="none"/>
   <path d="M47 51v2M47 53c-2 2.5-5.5 1.5-5.5-1M47 53c2 2.5 5.5 1.5 5.5-1"/>
   <path d="M23 42H11M23 47l-11 3M71 42h12M71 47l11 3"/>
   <path d="M31 63c-4 4-6 10-6 16v14h44V79c0-6-2-12-6-16"/>
   <path d="M35 88h7M52 88h7"/><path d="M69 93c10-1 13-9 10-15"/></svg>`;
}
function cat(p){if(!Store.catOn())return'';
  return `<div class="cat" onclick="catSay(this.dataset.p)" data-p="${p.replace(/"/g,'&quot;')}">
    ${catArt()}<div class="bubble">${p}</div></div>`;}

const BREAK=new Set(['of','in','on','to','for','and','with','is','are','at','from','over','where','but','next']);
function chunks(s){
  if(typeof CH!=='undefined' && CH[s]) return CH[s].map(c=>c[0]);
  const W=s.split(/\s+/),out=[];let cur=[];
  for(let i=0;i<W.length;i++){
    const b=W[i].replace(/[.,!?;:]/g,'').toLowerCase();
    if(cur.length>=2&&BREAK.has(b)&&W.length-i>1){out.push(cur);cur=[];}
    cur.push(W[i]); if(cur.length>=4){out.push(cur);cur=[];}
  }
  if(cur.length){if(cur.length===1&&out.length)out[out.length-1].push(cur[0]);else out.push(cur);}
  return out.map(c=>c.join(' '));
}
const wordsOf=s=>s.split(/\s+/);
/* транскрипция для последних k кусков — то, что сейчас звучит */
function trFor(sentence, from){
  const rows=(typeof CH!=='undefined')?CH[sentence]:null;
  if(!rows) return null;
  return rows.slice(from).map(r=>r[1]).join(' ');
}
const firstLetters=s=>wordsOf(s).map(w=>{
  const b=w.replace(/[.,!?;:]/g,''),t=w.slice(b.length);
  return b[0]+'·'.repeat(Math.max(0,b.length-1))+t;}).join(' ');

const PHASES=['Говори вместе','Собери','Расскажи'];
let block=-1, ph=0, si=0, step=0;
const scene=document.getElementById('scene'), rail=document.getElementById('rail'),
      phase=document.getElementById('phase');

/* ── ОГЛАВЛЕНИЕ ── */
function menu(){
  stop(); block=-1; rail.innerHTML=''; phase.textContent='';
  document.getElementById('home').style.visibility='hidden';
  const done=Store.all().done.length;
  scene.innerHTML=`
    <p class="eyebrow">Spotlight 6 · урок 1d · Culture Corner</p><h1>The United Kingdom</h1>
    <p class="sub">Каждый кусочек проходит три фазы: сначала говоришь вместе с диктором
      по 2–3 слова, потом собираешь предложение сам, потом рассказываешь по первым буквам.${
      done?`<br><br>Пройдено: ${done} из ${TEXT.length}.`:''}</p>
    <ul class="blocks">${TEXT.map((b,i)=>`
      <li class="${Store.isDone(i)?'ok':''}" data-i="${i}">
        <b>${i+1}. ${b.t}</b>
        <span>${Store.isDone(i)?'✓ пройдено':b.s.length+' предл.'}</span></li>`).join('')}</ul>
    <button class="big" id="traps" style="margin-top:18px">Слова, где чаще всего ошибаются</button>
    <button class="ghostbtn" id="listen">🔊 Послушать весь текст</button>
    ${done===TEXT.length?`<button class="big go" id="whole">Рассказать весь текст</button>`:''}
    <p class="why">Почему так: повтор вслух вместе с диктором ставит ритм и интонацию,
      а вспоминание без подсказки закрепляет крепче, чем перечитывание.</p>`;
  scene.querySelectorAll('.blocks li').forEach(li=>li.onclick=()=>{
    block=+li.dataset.i; ph=0; si=0; step=0; render();});
  document.getElementById('traps').onclick=trapScreen;
  document.getElementById('listen').onclick=()=>say(TEXT.flatMap(b=>b.s.map(x=>x.en)).join(' '));
  const w=document.getElementById('whole'); if(w) w.onclick=wholeText;
}

/* ── СЛОВА-ЛОВУШКИ ── */
function trapScreen(){
  stop(); rail.innerHTML=''; phase.textContent='';
  document.getElementById('home').style.visibility='visible';
  scene.innerHTML=`<p class="eyebrow">Произношение</p><h1>Слова-ловушки</h1>
    <p class="sub">Нажми на слово — послушай. Это те места текста, где ошибаются чаще всего.</p>
    ${TRAPS.map((t,i)=>`<div class="trap" data-i="${i}">
      <b>${t.w}</b><span>${t.n}</span></div>`).join('')}
    <button class="ghostbtn" id="back">К списку</button>`;
  scene.querySelectorAll('.trap').forEach(d=>d.onclick=()=>say(TRAPS[+d.dataset.i].w));
  document.getElementById('back').onclick=menu;
}

/* ── ФАЗЫ ── */
function drawRail(n,cur){
  rail.innerHTML='';
  for(let i=0;i<n;i++){const d=document.createElement('i');
    if(i<cur)d.className='done'; if(i===cur)d.className='now'; rail.appendChild(d);}
  phase.textContent=PHASES[ph];
}
function render(){
  if(block<0)return menu();
  stop();
  document.getElementById('home').style.visibility='visible';
  const b=TEXT[block];
  if(si>=b.s.length){ si=0; step=0; ph++; if(ph>=PHASES.length) return finish(); }
  const S=b.s[si];
  const head=`<p class="eyebrow">${b.t} · предложение ${si+1} из ${b.s.length}</p>`;

  /* ФАЗА 1 — говори вместе, кусками с конца */
  if(ph===0){
    const C=chunks(S.en);
    if(step>=C.length){ si++; step=0; return render(); }
    const from=C.length-1-step, part=C.slice(from).join(' '), whole=from===0;
    drawRail(C.length, step);
    const shown=C.slice(from).map((c,i)=>
      i===0?`<span class="new">${c}</span>`:`<span class="old">${c}</span>`).join(' ');
    const gap=Math.round(500+wordsOf(part).length*300/rate);
    scene.innerHTML=`${head}
      ${(whole&&S.pic)?`<img class="pic ${S.pic}" src="${PICS[S.pic]}" alt="">`:''}
      <p class="piece">${shown}</p>
      <p class="tr big-tr">${trFor(S.en, from) || (whole?S.tr:'')}</p>
      <p class="ru">${S.ru}</p>
      <button class="big" id="lp">🔁 Говорить вместе</button>
      <div class="row">${[['0.6','медленно'],['0.75','обычно'],['0.95','быстро']].map(([v,l])=>
        `<button class="spd${+v===rate?' on':''}" data-r="${v}">${l}</button>`).join('')}</div>
      <button class="big go" id="nx">${whole?'Получилось — дальше':'Получается — добавить кусочек'}</button>
      <button class="ghostbtn" id="once">🔊 Один раз</button>`;
    const lp=document.getElementById('lp');
    lp.onclick=()=>{
      if(looping){stop(); lp.classList.remove('on'); lp.textContent='🔁 Говорить вместе';}
      else{looping=true; lp.classList.add('on'); lp.textContent='⏹ Хватит'; loop(part,gap);}
    };
    document.getElementById('once').onclick=()=>{stop(); say(part);
      lp.classList.remove('on'); lp.textContent='🔁 Говорить вместе';};
    scene.querySelectorAll('.spd').forEach(x=>x.onclick=()=>{
      rate=+x.dataset.r;
      scene.querySelectorAll('.spd').forEach(y=>y.classList.remove('on'));
      x.classList.add('on');
      if(looping){speechSynthesis.cancel(); loop(part,Math.round(500+wordsOf(part).length*300/rate));}
    });
    document.getElementById('nx').onclick=()=>{step++; render();};
    say(part); return;
  }

  /* ФАЗА 2 — собери предложение из слов */
  if(ph===1){
    drawRail(b.s.length, si);
    const W=wordsOf(S.en);
    scene.innerHTML=`${head}
      ${S.pic?`<img class="pic ${S.pic}" src="${PICS[S.pic]}" alt="">`:''}
      <p class="ru">${S.ru}</p>
      <div class="line" id="line"></div><div class="bank" id="bank"></div>
      <button class="ghostbtn" id="hint">🔊 Подсказать на слух</button>`;
    let at=0;
    const line=document.getElementById('line'), bank=document.getElementById('bank');
    const paint=()=>line.innerHTML=W.slice(0,at).join(' ')+
      (at<W.length?' <span class="ghost">···</span>':'');
    [...W.keys()].sort(()=>Math.random()-.5).forEach(idx=>{
      const c=document.createElement('button'); c.className='chipw'; c.textContent=W[idx];
      c.onclick=()=>{
        if(W[idx]===W[at]){at++; c.classList.add('used'); paint();
          if(at===W.length){say(S.en); setTimeout(()=>{si++; render();},800);} }
        else{c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),300);}
      };
      bank.appendChild(c);
    });
    document.getElementById('hint').onclick=()=>say(S.en);
    paint(); return;
  }

  /* ФАЗА 3 — расскажи по первым буквам */
  drawRail(b.s.length, si);
  scene.innerHTML=`${head}
    ${S.pic?`<img class="pic ${S.pic}" src="${PICS[S.pic]}" alt="">`:''}
    <p class="ru">${S.ru}</p>
    <p class="en">${firstLetters(S.en)}</p>
    <p class="sub">Скажи вслух целиком, потом проверь себя.</p>
    <button class="big" id="show">Показать</button>
    <button class="ghostbtn" id="sp">🔊 Послушать</button>`;
  document.getElementById('sp').onclick=()=>say(S.en);
  document.getElementById('show').onclick=()=>{
    say(S.en);
    scene.innerHTML=`${head}<p class="en">${S.en}</p><p class="ru">${S.ru}</p>
      <p class="sub">Так же и сказала?</p>
      <button class="big go" id="yes">Да, получилось</button>
      <button class="ghostbtn" id="no">Не совсем — ещё раз</button>`;
    document.getElementById('yes').onclick=()=>{si++; render();};
    document.getElementById('no').onclick=render;
  };
}

function finish(){
  Store.mark(block); stop(); rail.innerHTML=''; phase.textContent='';
  document.getElementById('home').style.visibility='visible';
  const left=TEXT.length-Store.all().done.length;
  const line=left?`Кусочек готов. Осталось ${left}.`:'Весь текст. Можешь рассказывать.';
  setTimeout(()=>catSay(line),400);
  scene.innerHTML=`<h1>${TEXT[block].t} — готово</h1>${cat(line)}
    <button class="big go" id="all" style="margin-top:18px">🔊 Послушать кусочек целиком</button>
    ${block+1<TEXT.length?`<button class="big" id="nx2">Следующий кусочек</button>`:''}
    <button class="ghostbtn" id="back">К списку</button>`;
  document.getElementById('all').onclick=()=>say(TEXT[block].s.map(x=>x.en).join(' '));
  document.getElementById('back').onclick=menu;
  const n=document.getElementById('nx2');
  if(n) n.onclick=()=>{block++; ph=0; si=0; step=0; render();};
}

function wholeText(){
  stop(); rail.innerHTML=''; phase.textContent='';
  document.getElementById('home').style.visibility='visible';
  const all=TEXT.flatMap(b=>b.s);
  scene.innerHTML=`<p class="eyebrow">Весь текст</p><h1>По первым буквам</h1>
    <p class="sub">Расскажи вслух целиком. Застряла — нажми строчку, она откроется.</p>
    ${all.map((S,i)=>`<p class="en" data-i="${i}" style="font-size:19px;margin:0 0 12px;cursor:pointer">
      ${firstLetters(S.en)}</p>`).join('')}
    <button class="ghostbtn" id="back">К списку</button>`;
  scene.querySelectorAll('[data-i]').forEach(p=>p.onclick=()=>{
    const S=all[+p.dataset.i]; p.textContent=S.en; say(S.en);});
  document.getElementById('back').onclick=menu;
}

document.getElementById('home').onclick=()=>{stop(); menu();};
document.getElementById('catBtn').onclick=()=>{Store.toggleCat(); block<0?menu():render();};
menu();
</script>
</body>
</html>
